[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gen"
version = "0.1.0"
description = "Reproducible batch generation of 360 skyboxes and flat images for VR scenes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core stays deliberately light: no torch, so the stub backend installs
# anywhere in seconds. GPU work lives behind the `local` extra.
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
local = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.29",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
image-gen = "image_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
